<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
</head>
<body>
<title>AI投資委員会</title>
<style>
  /* 2026-10-26 に作り直した（2回目）。1回目の白黒だけの形は「白黒すぎて見にくい」と言われたので、
     見本のサン防災にならって色を戻した:
     - 画面ごとに地の色を変える（成績＝うすい緑・議論＝うすい水色・銘柄＝うすいオレンジ・通信簿＝うすい黄色）。サン防災の「場面ごとに空の色が変わる」
     - 中身は白い板にのせる。押せる所と選んでいる所は青1色
     - 4本の線は色と線の種類で、4人の担当者もそれぞれの色で見分ける
     - 上がった＝緑・下がった＝赤は、意味の色として取っておく
     形は大手アプリ（Google の Material 3 のような、色のついた面と白い板）に合わせる */
  :root{
    --scene:#eef7f1;
    --card:#ffffff; --fill:#f1f4f2;
    --ink:#1d2320; --ink-2:#45504a; --ink-3:#5f6a64;
    --line:#e3e8e4; --line-2:#cbd3ce;
    --accent:#1666d0; --on-accent:#ffffff; --accent-wash:#e4eefc;
    --l-ai:#1666d0; --l-spy:#e8710a; --l-eq:#9b4dca; --l-rnd:#98a29c;
    --a-chair:#1d2320; --a-fund:#1e8e3e; --a-tech:#0b7fab; --a-macro:#d56a00; --a-risk:#8e24aa;
    --up:#0a7a3d; --down:#c8261f; --warn:#8a5a00; --flat:#5f6a64;
    --up-wash:#e3f4e9; --down-wash:#fbe7e6; --warn-wash:#f8eed5;
    --s-home:#eef7f1; --s-debate:#edf4fb; --s-ticker:#fdf2e8; --s-score:#fbf6e2;
    --sans:system-ui,-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Meiryo",sans-serif;
    --mono:var(--sans);
    --tabbar:68px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --card:#1b211e; --fill:#262d29;
      --ink:#eef2ef; --ink-2:#c9d1cc; --ink-3:#a2ada7;
      --line:#2e3632; --line-2:#46504a;
      --accent:#8ab4f8; --on-accent:#0b1a33; --accent-wash:#1d2a40;
      --l-ai:#8ab4f8; --l-spy:#fdac5c; --l-eq:#c58af9; --l-rnd:#76817b;
      --a-chair:#eef2ef; --a-fund:#81c995; --a-tech:#78c4e8; --a-macro:#fbbc6a; --a-risk:#d7a2f0;
      --up:#5bd68a; --down:#ff8a80; --warn:#f6c453; --flat:#a2ada7;
      --up-wash:#173826; --down-wash:#40201d; --warn-wash:#3a3013;
      --s-home:#0f1a14; --s-debate:#0f1620; --s-ticker:#1d150e; --s-score:#1b180c;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --card:#1b211e; --fill:#262d29;
    --ink:#eef2ef; --ink-2:#c9d1cc; --ink-3:#a2ada7;
    --line:#2e3632; --line-2:#46504a;
    --accent:#8ab4f8; --on-accent:#0b1a33; --accent-wash:#1d2a40;
    --l-ai:#8ab4f8; --l-spy:#fdac5c; --l-eq:#c58af9; --l-rnd:#76817b;
    --a-chair:#eef2ef; --a-fund:#81c995; --a-tech:#78c4e8; --a-macro:#fbbc6a; --a-risk:#d7a2f0;
    --up:#5bd68a; --down:#ff8a80; --warn:#f6c453; --flat:#a2ada7;
    --up-wash:#173826; --down-wash:#40201d; --warn-wash:#3a3013;
    --s-home:#0f1a14; --s-debate:#0f1620; --s-ticker:#1d150e; --s-score:#1b180c;
    color-scheme:dark;
  }

  *{box-sizing:border-box;}
  /* 隠した画面は必ず隠す。.stack の display:flex が hidden に勝ってしまい、
     公開ページ（GitHub Pages）では4つの画面が縦に全部つながって見えていた */
  [hidden]{display:none !important;}
  body{
    margin:0; color:var(--ink); background:var(--s-home);
    font-family:var(--sans); font-size:17px; line-height:1.6;
    -webkit-text-size-adjust:100%; -webkit-font-smoothing:antialiased;
    padding-bottom:calc(var(--tabbar) + env(safe-area-inset-bottom, 0px));
  }
  /* 画面ごとの地の色 */
  body[data-view="home"]{background:var(--s-home);}
  body[data-view="debate"]{background:var(--s-debate);}
  body[data-view="ticker"]{background:var(--s-ticker);}
  body[data-view="score"]{background:var(--s-score);}
  h1,h2,h3{text-wrap:balance; margin:0;}
  .mono,.num{font-variant-numeric:tabular-nums;}

  /* ---- いちばん上 ---- */
  .top{max-width:1080px; margin:0 auto; padding:20px 16px 0;}
  .top h1{font-size:28px; line-height:1.25; font-weight:800; letter-spacing:-.01em;}
  .top .as-of{display:block; margin-top:2px; font-size:13px; color:var(--ink-3);}

  /* ---- 下の切り替え（パソコンの幅では左の縦の帯） ---- */
  .tabs{
    position:fixed; left:0; right:0; bottom:0; z-index:20; display:flex;
    background:var(--card); border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom, 0px);
  }
  .tab{
    appearance:none; border:0; background:none; cursor:pointer; font:inherit;
    flex:1; min-height:var(--tabbar); display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:3px;
    font-size:12px; font-weight:600; color:var(--ink-3);
  }
  .tab svg{
    width:56px; height:30px; padding:3px 15px; border-radius:999px; box-sizing:border-box;
    fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round;
  }
  .tab[aria-selected="true"]{color:var(--accent); font-weight:800;}
  .tab[aria-selected="true"] svg{background:var(--accent-wash); stroke-width:2.2;}
  .tab:focus-visible{outline:2px solid var(--accent); outline-offset:-6px; border-radius:14px;}
  @media (min-width:900px){
    body{padding-bottom:0; padding-left:96px;}
    .tabs{top:0; right:auto; width:96px; flex-direction:column; justify-content:flex-start;
          padding:20px 0; border-top:0; border-right:1px solid var(--line);}
    .tab{flex:none; min-height:76px;}
  }

  main{max-width:1080px; margin:0 auto; padding:16px 16px 40px;}
  .stack{display:flex; flex-direction:column; gap:28px;}
  .block{display:flex; flex-direction:column; gap:10px; min-width:0;}
  .block > h2{font-size:19px; font-weight:800; line-height:1.3;}
  .note{font-size:13px; color:var(--ink-3); line-height:1.7; margin:0;}

  /* ---- 白い板（中身をのせる） ---- */
  .panel{background:var(--card); border-radius:16px; padding:4px 16px;}
  .panel.pad{padding:16px;}

  /* ---- 成績: 総資産 ---- */
  .headline{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap;}
  .headline .big{font-size:44px; font-weight:800; line-height:1.05; letter-spacing:-.01em; font-variant-numeric:tabular-nums;}
  .headline .delta{font-size:17px; font-weight:800; font-variant-numeric:tabular-nums; padding:2px 10px; border-radius:999px;}
  .headline .delta.pos{background:var(--up-wash);} .headline .delta.neg{background:var(--down-wash);}
  .subline{font-size:15px; color:var(--ink-2); margin:0; font-variant-numeric:tabular-nums;}
  .subline.live{margin-top:2px; font-size:13px; color:var(--up);}
  .subline.live .sector{color:var(--ink-3);}
  @media (prefers-reduced-motion:no-preference){
    .subline.live{animation:livepulse 2.4s ease-in-out infinite;}
  }
  @keyframes livepulse{50%{opacity:.6;}}
  .pos{color:var(--up);} .neg{color:var(--down);} .flat{color:var(--flat);}

  /* ---- ベースラインとの差 ---- */
  .bl{display:flex; flex-direction:column; background:var(--card); border-radius:16px; padding:0 16px; overflow:hidden;}
  .bl-row{display:grid; grid-template-columns:minmax(0,1fr) auto auto; align-items:center; gap:12px;
          min-height:54px; padding:6px 0; border-bottom:1px solid var(--line);}
  .bl-row:last-child{border-bottom:0;}
  .bl-row.me{margin:0 -16px; padding:6px 16px; background:var(--accent-wash); border-bottom:0;}
  .bl-name{display:flex; align-items:center; gap:10px; font-size:16px; min-width:0;}
  .bl-name b{font-weight:600;}
  .bl-row.me .bl-name b{font-weight:800;}
  .swatch{width:24px; height:0; flex:none; border-top:3px solid var(--l-rnd);}
  .sw-ai{border-top:4px solid var(--l-ai); border-radius:2px;}
  .sw-spy_hold{border-top:3px solid var(--l-spy);}
  .sw-equal_hold{border-top:3px dashed var(--l-eq);}
  .sw-random{border-top:3px dotted var(--l-rnd);}
  .bl-total{font-size:15px; color:var(--ink-2); font-variant-numeric:tabular-nums;}
  .bl-diff{font-size:16px; font-weight:800; min-width:72px; text-align:right; font-variant-numeric:tabular-nums;}

  /* ---- グラフ ---- */
  .chart{position:relative; height:280px;}
  .chart.sm{height:200px;}
  @media (max-width:640px){ .chart{height:240px;} .chart.sm{height:180px;} }

  /* ---- 表 ---- */
  .scroll{overflow-x:auto; -webkit-overflow-scrolling:touch;}
  table{width:100%; border-collapse:collapse; font-size:15px;}
  thead th{
    font-size:13px; color:var(--ink-3); font-weight:600; text-align:left;
    padding:12px 8px 8px; white-space:nowrap; border-bottom:1px solid var(--line-2);
  }
  tbody td{padding:12px 8px; border-bottom:1px solid var(--line); vertical-align:middle;}
  tbody tr:last-child td{border-bottom:0;}
  th:first-child,td:first-child{padding-left:0;}
  th:last-child,td:last-child{padding-right:0;}
  th.r,td.r{text-align:right;}
  td.mono{white-space:nowrap; font-variant-numeric:tabular-nums;}
  td.num,th.num{font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap;}
  .tk{font-weight:800; letter-spacing:.01em;}
  .sector{font-size:13px; color:var(--ink-3);}

  /* ---- 現在の保有: 1銘柄1行 ---- */
  .plist{list-style:none; margin:0; padding:0 16px; background:var(--card); border-radius:16px;}
  .prow{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:2px 12px; padding:12px 0; border-bottom:1px solid var(--line);}
  .prow:last-child{border-bottom:0;}
  .prow .tk{font-size:17px;}
  .pv{text-align:right; font-weight:800; font-variant-numeric:tabular-nums;}
  .pmeta{font-size:13px; color:var(--ink-3); font-variant-numeric:tabular-nums;}
  .pr{text-align:right; font-size:15px; font-weight:800; font-variant-numeric:tabular-nums;}
  .wrow{grid-column:1 / -1; display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:10px;
        margin-top:4px; font-size:13px; color:var(--ink-3); font-variant-numeric:tabular-nums;}
  .wbar{position:relative; height:8px; background:var(--fill); border-radius:4px; min-width:56px;}
  .wbar i{position:absolute; inset:0 auto 0 0; background:var(--accent); border-radius:4px;}
  .pend{list-style:none; margin:0; padding:0 16px; background:var(--card); border-radius:16px;}
  .pend li{display:flex; flex-wrap:wrap; align-items:center; gap:4px 8px; padding:12px 0; border-bottom:1px solid var(--line); font-size:15px;}
  .pend li:last-child{border-bottom:0;}

  /* ---- ラウンド・金額と増減率の切り替え ---- */
  .segbar{display:flex; gap:8px; flex-wrap:wrap;}
  .seg{
    font:inherit; font-size:15px; font-weight:700; color:var(--ink); cursor:pointer; text-align:left;
    background:var(--card); border:1px solid var(--line-2); border-radius:999px; min-height:44px; padding:6px 16px;
    display:flex; flex-direction:column; justify-content:center; gap:0;
  }
  .seg.on{background:var(--accent); border-color:var(--accent); color:var(--on-accent);}
  .seg:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .seg-sub{font-size:12px; opacity:.8; font-variant-numeric:tabular-nums;}
  .segbar.right{align-self:flex-start; gap:0; padding:3px; border-radius:999px; background:var(--card);}
  .segbar.right .seg{background:none; border:0; color:var(--ink-3);}
  .segbar.right .seg.on{background:var(--accent); color:var(--on-accent);}
  .seg.mini{flex-direction:row; align-items:center;}

  /* ---- 売買の印・ラベル ---- */
  .chip{
    display:inline-flex; align-items:center; gap:4px;
    font-size:12px; font-weight:800; letter-spacing:.02em; line-height:1.5;
    padding:1px 8px; border-radius:6px; border:0;
  }
  .s-BUY{color:var(--up); background:var(--up-wash);}
  .s-SELL{color:var(--down); background:var(--down-wash);}
  .s-AVOID{color:var(--warn); background:var(--warn-wash);}
  .s-HOLD{color:var(--ink-2); background:var(--fill);}
  .badge{font-size:12px; font-weight:800; padding:1px 8px; border-radius:999px; line-height:1.5;}
  .b-conflict{color:var(--down); background:var(--down-wash);}
  .b-split{color:var(--warn); background:var(--warn-wash);}
  .b-agree{color:var(--ink-2); background:var(--fill);}
  .b-hit{color:var(--up); background:var(--up-wash);}

  /* ---- 日付・銘柄の選択（横にすべらせる1行） ---- */
  .pills{position:relative; display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; margin:0 -16px; padding:0 16px 2px;}
  .pills::-webkit-scrollbar{display:none;}
  .pill{
    appearance:none; cursor:pointer; white-space:nowrap; flex:none;
    font:inherit; font-size:15px; font-weight:700; font-variant-numeric:tabular-nums;
    min-height:44px; min-width:44px; padding:0 16px; border-radius:999px;
    border:1px solid var(--line-2); background:var(--card); color:var(--ink);
  }
  .pill[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--on-accent);}
  .pill:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .tkgrid{flex-wrap:nowrap;}
  .more{
    align-self:flex-start; font:inherit; font-size:15px; font-weight:800; cursor:pointer;
    min-height:44px; padding:0 18px; border-radius:999px; border:1px solid var(--accent);
    background:var(--card); color:var(--accent);
  }

  /* ---- 議論 ---- */
  .lead{font-size:17px; line-height:1.8; margin:0; padding:16px; background:var(--card); border-radius:16px;}
  .counts{display:flex; gap:8px; flex-wrap:wrap; margin:0; font-size:14px; font-weight:700; font-variant-numeric:tabular-nums;}
  .counts span{padding:2px 10px; border-radius:999px; background:var(--card); color:var(--ink-2);}

  details.deb{background:var(--card); border-radius:16px; padding:0 16px;}
  details.deb + details.deb{margin-top:10px;}
  details.deb > summary{
    cursor:pointer; list-style:none; min-height:56px; padding:10px 28px 10px 0; position:relative;
    display:flex; align-items:center; gap:6px 10px; flex-wrap:wrap;
  }
  details.deb > summary::-webkit-details-marker{display:none;}
  details.deb > summary::after{
    content:""; position:absolute; right:6px; top:50%; width:9px; height:9px; margin-top:-7px;
    border-right:2px solid var(--ink-3); border-bottom:2px solid var(--ink-3); transform:rotate(45deg);
  }
  details.deb[open] > summary::after{transform:rotate(-135deg); margin-top:-2px;}
  details.deb > summary:focus-visible{outline:2px solid var(--accent); outline-offset:-2px;}
  .deb-tk{font-weight:800; font-size:17px;}
  .deb-views{display:flex; gap:4px; margin-left:auto; flex-wrap:wrap;}
  .deb-views .mini{display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:800; padding:1px 6px; border-radius:4px; line-height:1.5;}
  .deb-views .mini::before{content:""; width:7px; height:7px; border-radius:50%; background:var(--who, var(--ink-3));}
  .m-fundamental{--who:var(--a-fund);} .m-technical{--who:var(--a-tech);}
  .m-macro{--who:var(--a-macro);} .m-risk{--who:var(--a-risk);}

  .deb-body{padding:0 0 16px; display:flex; flex-direction:column; gap:14px;}
  .ruling{border-left:4px solid var(--accent); background:var(--accent-wash); border-radius:0 12px 12px 0; padding:12px 14px; display:flex; flex-direction:column; gap:8px;}
  .who{display:flex; align-items:center; flex-wrap:wrap; gap:6px 8px; font-size:15px; font-weight:800; color:var(--ink);}
  .who .dot{width:10px; height:10px; border-radius:50%; background:var(--who, var(--ink)); flex:none;}
  .who .conf{margin-left:auto; font-size:13px; font-weight:600; color:var(--ink-3); font-variant-numeric:tabular-nums;}
  .thesis{font-size:15px; line-height:1.8; margin:0; color:var(--ink-2);}
  .falsi{background:var(--fill); border-radius:10px; padding:10px 12px; font-size:14px; line-height:1.7; color:var(--ink-2);}
  .falsi b{display:block; font-size:12px; font-weight:800; color:var(--ink-3); margin-bottom:2px;}
  .views-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:12px;}
  .view{border-left:4px solid var(--who, var(--line-2)); padding:2px 0 2px 12px; display:flex; flex-direction:column; gap:8px;}
  .view.v-fundamental{--who:var(--a-fund);} .view.v-technical{--who:var(--a-tech);}
  .view.v-macro{--who:var(--a-macro);} .view.v-risk{--who:var(--a-risk);}
  .capline{display:flex; gap:10px; align-items:baseline; font-size:14px; color:var(--ink-2); border-top:1px solid var(--line); padding-top:12px;}
  .capline .lab{font-size:12px; font-weight:800; color:var(--a-risk); white-space:nowrap;}

  /* ---- 銘柄 ---- */
  .brand{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;}
  .tk-title{font-size:28px; font-weight:800; letter-spacing:.01em;}
  .brand .as-of{font-size:15px; color:var(--ink-3);}
  .facts{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:0 16px; background:var(--card); border-radius:16px; padding:4px 16px;}
  @media (min-width:640px){ .facts{grid-template-columns:repeat(auto-fit,minmax(140px,1fr));} }
  .fact{padding:10px 0; border-bottom:1px solid var(--line);}
  .fact dt{font-size:13px; color:var(--ink-3); margin:0;}
  .fact dd{margin:2px 0 0; font-size:20px; font-weight:800; font-variant-numeric:tabular-nums;}
  .tl{display:flex; flex-direction:column; background:var(--card); border-radius:16px; padding:0 16px;}
  .tl-item{display:grid; grid-template-columns:auto minmax(0,1fr); gap:12px; padding:14px 0; border-bottom:1px solid var(--line);}
  .tl-item:last-child{border-bottom:0;}
  .tl-date{font-size:13px; color:var(--ink-3); padding-top:2px; white-space:nowrap; font-variant-numeric:tabular-nums;}
  /* 色はページの中で担当者の色が入る。左の帯だけその色にし、文字は読みやすい色に戻す */
  .tl-card{display:flex; flex-direction:column; gap:6px; min-width:0; border-left:4px solid currentColor; padding-left:12px;}
  .tl-card .who{color:var(--ink);}
  .tl-card .who .dot{display:none;}

  .empty{background:var(--card); border-radius:16px; padding:22px 16px; text-align:center; color:var(--ink-3); font-size:15px;}
  .banner{background:var(--warn-wash); color:var(--ink); border-radius:12px; padding:12px 14px; font-size:15px;}
  @media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important;} }
</style>

<header class="top">
  <h1>AI投資委員会</h1>
  <span class="as-of" id="asOf"></span>
</header>
<nav class="tabs" role="tablist" aria-label="画面の切り替え">

    return p.length === 3 ? Number(p[1]) + "/" + Number(p[2]) : iso;
  }

  /* --------------------------------------------------------- グラフ */

  function drawChart(key, canvasId, config){
    const el = $(canvasId);
    if (!el || typeof Chart === "undefined") return;
    if (charts[key]) charts[key].destroy();
    Chart.defaults.font.family = cssVar("--sans");
    charts[key] = new Chart(el, config);
  }

  function axisOptions(yFormat){
    const grid = cssVar("--line");
    const label = cssVar("--ink-3");
    return {
      responsive:true, maintainAspectRatio:false,
      interaction:{ mode:"index", intersect:false },
      scales:{
        x:{ grid:{ color:grid, drawTicks:false },
            ticks:{ color:label, maxTicksLimit:6, font:{ size:12 } },
            border:{ color:grid } },
        y:{ grid:{ color:grid, drawTicks:false },
            ticks:{ color:label, maxTicksLimit:6, font:{ size:12 },
                    callback:yFormat },
            border:{ display:false } }
      }
    };
  }

  /* ---------------------------------------------------- 成績(ホーム) */

  /** いま見ているラウンドの口座まわり。
   *  ラウンドが無い古いデータでも壊れないよう、無ければ summary 自体を返す。 */
  function runView(){
    const s = state.summary;
    const runs = s.runs || [];
    if (!runs.length) return applyLive(s);
    let found = null;
    for (let i = 0; i < runs.length; i++){
      if (runs[i].id === state.run) found = runs[i];
    }
    if (!found){
      for (let i = 0; i < runs.length; i++){
        if (runs[i].is_primary) found = runs[i];
      }
    }
    return applyLive(found || runs[0]);
  }

  // 場中の現在値を、終値ベースの数字に上書きする。
  // 台帳そのものは終値で動いている(そうしないとカンニングになる)ので、
  // ここで差し替えるのは「いま売ったらいくらか」の表示だけ。
  function applyLive(r){
    const live = state.live;
    if (!live || !live.runs) return r;
    // 台帳が先に進んでいたら古い現在値なので使わない
    if (live.as_of_close !== state.summary.as_of) return r;

    const rid = r.id || state.summary.primary_run;
    const block = live.runs[rid];
    if (!block) return r;

    const out = Object.assign({}, r);
    const totals = Object.assign({}, r.totals);
    Object.keys(block).forEach(function(key){
      if (block[key] && block[key].total_equity != null){
        totals[key] = block[key].total_equity;
      }
    });
    out.totals = totals;

    const ai = block.ai;
    if (ai){
      out.account = Object.assign({}, r.account, {
        total_equity: ai.total_equity,
        cash: ai.cash,
        holdings_value: ai.total_equity - ai.cash,
        return_pct: ai.return_pct
      });
      out.positions = (r.positions || []).map(function(p){
        const q = live.quotes && live.quotes[p.ticker];
        const held = ai.positions && ai.positions[p.ticker];
        if (!q || !held) return p;
        return Object.assign({}, p, {
          price: q.price,
          value: held.value,
          return_pct: p.avg_cost ? (q.price / p.avg_cost - 1) : p.return_pct,
          weight: ai.total_equity ? held.value / ai.total_equity : p.weight
        });
      });
    }
    out.liveAt = live.at;
    return out;
  }

  function renderHome(){
    const s = state.summary;
    const r = runView();
    const acc = r.account || {};
    const ret = acc.return_pct;
    const totals = r.totals || {};
    const eq = r.equity || { days:[], accounts:[] };
    const initial = r.initial_cash || 100000;

    const rows = (eq.accounts || []).map(function(a){
      const total = totals[a.key];
      const diff = (total != null && totals.ai != null)
        ? (totals.ai - total) / initial : null;
      const isMe = a.key === "ai";
      return '<div class="bl-row' + (isMe ? " me" : "") + '">' +
        '<span class="bl-name"><i class="swatch sw-' + esc(a.key) + '"></i><b>' + esc(a.label) + '</b></span>' +
        '<span class="bl-total">' + usd(total) + '</span>' +
        (isMe
          ? '<span class="bl-diff ' + tone(ret) + '">' + signed(ret) + '</span>'
          : '<span class="bl-diff ' + tone(diff) + '">' + signed(diff) + '</span>') +
      '</div>';
    }).join("");

    // 1銘柄1行。棒の右端が1銘柄の上限（資産の20%など）
    const posRows = (r.positions || []).map(function(p){
      const cap = (s.rules && s.rules.max_position_pct) || 0.2;
      return '<li class="prow">' +
        '<div><span class="tk">' + esc(p.ticker) + '</span> <span class="sector">' + esc(p.sector) + '</span></div>' +
        '<div class="pv">' + usd(p.value, 0) + '</div>' +
        '<div class="pmeta">' + Number(p.shares).toLocaleString() + '株 · 取得 ' + usd(p.avg_cost) + ' · 現在 ' + usd(p.price) + '</div>' +
        '<div class="pr ' + tone(p.return_pct) + '">' + signed(p.return_pct, 1) + '</div>' +
        '<div class="wrow"><div class="wbar" title="上限 ' + pct(cap,0) + '">' +
          '<i style="width:' + Math.min(100, (p.weight / cap) * 100).toFixed(1) + '%"></i></div>' +
          '<span>資産の ' + pct(p.weight, 1) + '（上限 ' + pct(cap, 0) + '）</span></div>' +
      '</li>';
    }).join("");

    const pending = (r.pending_orders || []).map(function(o){
      return '<li><span class="chip s-' + esc(o.side) + '">' + esc(o.side) + '</span> ' +
        '<span class="tk">' + esc(o.ticker) + '</span> ' +
        '<span class="mono">' + o.shares + '株</span> ' +
        '<span class="sector">' + esc(o.created_date) + ' 発注 → 次の寄り付きで約定</span></li>';
    }).join("");

    const runs = s.runs || [];
    const runBar = runs.length > 1
      ? '<div class="block">' +
          '<h2>ラウンド</h2>' +
          '<div class="segbar" id="runBar">' +
            runs.map(function(x){
              return '<button class="seg' + (x.id === r.id ? " on" : "") + '" ' +
                'data-run="' + esc(x.id) + '">' + esc(x.label || x.id) +
                '<span class="seg-sub">' + usd(x.initial_cash, 0) +
                (x.status !== "active" ? " · 停止中" : "") + '</span></button>';
            }).join("") +
          '</div>' +
          '<p class="note">同じAIの同じ判断を、違う金額に当てはめた結果。' +
            '判断は「資産の何%」で出るので、金額を増やしても委員会は1日1回のままで、' +
            'AIの使用量は変わらない。違いは金額だけなので、金額そのものの効き方が見える。</p>' +
        '</div>'
      : '';

    $("view-home").innerHTML =
      (state.offline ? '<div class="banner">最新データを読み込めませんでした。' +
        '表示しているのは ' + esc(s.updated) + ' 時点の内容です。</div>' : '') +
      runBar +
      '<div class="block">' +
        '<div class="headline">' +
          '<span class="big">' + usd(acc.total_equity, 0) + '</span>' +
          '<span class="delta ' + tone(ret) + '">' + signed(ret) + '</span>' +
        '</div>' +
        '<p class="subline">現金 ' + usd(acc.cash, 0) + ' / 株式 ' + usd(acc.holdings_value, 0) +
          ' &nbsp;·&nbsp; 元手 ' + usd(initial, 0) + '</p>' +
        (r.liveAt
          ? '<p class="subline live">● 現在値 ' + esc(clock(r.liveAt)) + ' 時点' +
            '<span class="sector"> — 台帳は ' + esc(s.as_of) + ' の終値で締めています</span></p>'
          : '') +
      '</div>' +

      '<div class="block">' +
        '<h2>ベースラインとの差</h2>' +
        '<div class="bl">' + rows + '</div>' +
        '<p class="note">右端は AI委員会 との差。' +
          '同じ期間・同じ約定ルールで動かした3つに勝てていなければ、AIの判断には価値がない。</p>' +
      '</div>' +

      '<div class="block">' +
        '<h2>資産推移</h2>' +
        '<div class="segbar right">' +
          '<button class="seg mini' + (state.pctMode ? "" : " on") + '" data-mode="usd">金額</button>' +
          '<button class="seg mini' + (state.pctMode ? " on" : "") + '" data-mode="pct">増減率</button>' +
        '</div>' +
        '<div class="panel pad"><div class="chart"><canvas id="cEquity"></canvas></div></div>' +
        (runs.length > 1
          ? '<p class="note">金額の違うラウンドを同じドル軸に並べても高さが違うだけで比べられない。' +
            '増減率にすると、どちらがよく増えたかが同じ軸で見える。</p>'
          : '') +

      '<div class="block">' +
        '<h2>現在の保有</h2>' +
        (posRows
          ? '<ul class="plist">' + posRows + '</ul>'
          : '<div class="empty">保有なし(すべて現金)</div>') +
      '</div>' +

      (pending
        ? '<div class="block"><h2>未約定の注文</h2>' +
          '<ul class="pend">' + pending + '</ul>' +
          '<p class="note">判断した時点では翌日の始値が分からないので、注文はいったん保留し、' +
          '翌営業日の寄り付きで約定させている。</p></div>'
        : '');

    // ラウンドの切り替えと、金額 / 増減率の切り替え。
    // innerHTML を作り直すたびにボタンも作り直されるので、ここで毎回つなぐ。
    const bar = $("runBar");
    if (bar){
      bar.querySelectorAll("[data-run]").forEach(function(btn){
        btn.addEventListener("click", function(){
          state.run = btn.getAttribute("data-run");
          renderHome();
        });
      });
    }
    $("view-home").querySelectorAll("[data-mode]").forEach(function(btn){
      btn.addEventListener("click", function(){
        state.pctMode = btn.getAttribute("data-mode") === "pct";
        renderHome();
      });
    });

    const days = eq.days || [];
    const asPct = state.pctMode;
    // 増減率は「元手からの増減」。金額の違うラウンドを同じ軸に乗せるための変換。
    const conv = function(v){
      return v == null ? null : (asPct ? (v / initial - 1) * 100 : v);
    };

    drawChart("equity", "cEquity", {
      type:"line",
      data:{
        labels: days.map(jpDate),
        datasets: (eq.accounts || []).map(function(a){
          const c = cssVar(ACCOUNT_COLOR[a.key] || "--flat");
          const me = a.key === "ai";
          return {
            label:a.label, data:(a.values || []).map(conv),
            borderColor:c, backgroundColor:c,
            borderWidth: me ? 2.6 : 1.6, borderDash: ACCOUNT_DASH[a.key] || [4,4],
            pointRadius:0, pointHoverRadius:3, tension:.15, spanGaps:true
          };
        })
      },
      options: Object.assign(axisOptions(function(v){
        return asPct ? v.toFixed(1) + "%" : "$" + (v/1000).toFixed(1) + "k";
      }), {
        plugins:{
          legend:{ labels:{ color:cssVar("--ink-2"), boxWidth:18, boxHeight:2,
                            usePointStyle:false, font:{ size:13 } } },
          tooltip:{ callbacks:{ label:function(c){
            return c.dataset.label + "  " +
              (asPct ? (c.parsed.y >= 0 ? "+" : "") + c.parsed.y.toFixed(2) + "%" : usd(c.parsed.y));
          } } }
        }
      })
    });
  }

  /* ------------------------------------------------------------ 議論 */

  function viewCard(v){
    return '<div class="view v-' + esc(v.source) + '">' +
      '<div class="who"><i class="dot"></i>' + esc(v.label) +
        '<span class="chip s-' + esc(v.stance) + '" style="margin-left:6px">' + esc(v.stance) + '</span>' +
        '<span class="conf">確信 ' + (v.confidence != null ? pct(v.confidence, 0) : "—") + '</span>' +
      '</div>' +
      (v.thesis ? '<p class="thesis">' + esc(v.thesis) + '</p>' : '') +
      (v.falsification ? '<div class="falsi"><b>反証条件</b>' + esc(v.falsification) + '</div>' : '') +
    '</div>';
  }

  function debateEntry(t){
    const badgeClass = t.agreement === "対立" ? "b-conflict"
                     : t.agreement === "分かれた" ? "b-split" : "b-agree";
    const minis = (t.views || []).map(function(v){
      return '<span class="mini s-' + esc(v.stance) + ' m-' + esc(v.source) + '" title="' + esc(v.label) + '">' + esc(v.stance) + '</span>';
    }).join("");

    const cap = t.cap && (t.cap.max_pct != null || t.cap.reason)
      ? '<div class="capline"><span class="lab">リスク上限 ' +
        (t.cap.max_pct != null ? pct(t.cap.max_pct, 0) : "—") + '</span>' +
        '<span>' + esc(t.cap.reason) + '</span></div>'
      : '';

    const ruling = t.action
      ? '<div class="ruling">' +
          '<div class="who"><i class="dot"></i>議長の裁定' +
            '<span class="chip s-' + esc(t.action) + '" style="margin-left:6px">' + esc(t.action) + '</span>' +
            (t.action === "BUY" && t.target_pct
              ? '<span class="chip s-HOLD" style="margin-left:4px">目標 ' + pct(t.target_pct,1) + '</span>' : '') +
            '<span class="conf">確信 ' + (t.confidence != null ? pct(t.confidence,0) : "—") +
              (t.horizon_days ? ' / ' + t.horizon_days + '日' : '') + '</span>' +
          '</div>' +
          (t.thesis ? '<p class="thesis">' + esc(t.thesis) + '</p>' : '') +
          (t.falsification ? '<div class="falsi"><b>反証条件</b>' + esc(t.falsification) + '</div>' : '') +
        '</div>'
      : '';

    return '<details class="deb a-' + esc(t.action || "HOLD") + '"' + (t.agreement === "対立" ? " open" : "") + '>' +
      '<summary>' +
        '<span class="deb-tk">' + esc(t.ticker) + '</span>' +
        '<span class="sector">' + esc(t.sector) + '</span>' +
        (t.action ? '<span class="chip s-' + esc(t.action) + '">' + esc(t.action) + '</span>' : '') +
        '<span class="badge ' + badgeClass + '">' + esc(t.agreement) + '</span>' +
        '<span class="deb-views">' + minis + '</span>' +
      '</summary>' +
      '<div class="deb-body">' + ruling +
        '<div class="views-grid">' + (t.views || []).map(viewCard).join("") + '</div>' +
        cap +
      '</div>' +
    '</details>';
  }

  function renderDebate(){
    const s = state.summary;
    const allDays = s.days || [];
    if (!state.day && allDays.length) state.day = allDays[0];

    const pills = allDays.map(function(d){
      return '<button class="pill" type="button" data-day="' + esc(d) + '" aria-pressed="' +
        (d === state.day ? "true" : "false") + '">' + esc(d) + '</button>';
    }).join("");

    const day = state.day ? state.days[state.day] : null;
    let body;

    if (!allDays.length){
      body = '<div class="empty">まだ議論の記録がありません。</div>';
    } else if (!day){
      body = '<div class="empty">' + (state.offline
        ? "この端末では過去の議論を読み込めません。"
        : esc(state.day) + " の議論を読み込んでいます…") + '</div>';
    } else {
      const c = day.counts || {};
      const risk = day.risk || {};
      const concerns = (risk.concerns || []).map(function(x){
        return '<li>' + esc(typeof x === "string" ? x : JSON.stringify(x)) + '</li>';
      }).join("");

      body =
        '<div class="block">' +
          '<h2>議長の総括</h2>' +
          '<p class="lead">' + esc(day.chair_summary) + '</p>' +
          '<p class="counts"><span>BUY ' + (c.BUY||0) + '</span><span>SELL ' + (c.SELL||0) +
            '</span><span>HOLD ' + (c.HOLD||0) + '</span></p>' +
        '</div>' +
        (day.dissent
          ? '<div class="block"><h2>採らなかった意見</h2>' +
            '<div class="panel pad"><p class="thesis" style="margin:0">' + esc(day.dissent) + '</p></div></div>'
          : '') +
        (risk.portfolio_assessment || concerns
          ? '<div class="block"><h2>リスク管理の所見</h2><div class="panel pad" style="display:flex;flex-direction:column;gap:10px">' +
            (risk.max_total_exposure != null
              ? '<p class="subline" style="margin:0">株式の総枠 ' + pct(risk.max_total_exposure,0) + ' まで</p>' : '') +
            (risk.portfolio_assessment ? '<p class="thesis" style="margin:0">' + esc(risk.portfolio_assessment) + '</p>' : '') +
            (concerns ? '<ul class="thesis" style="margin:0;padding-left:1.1em">' + concerns + '</ul>' : '') +
            '</div></div>'
          : '') +
        '<div class="block">' +
          '<h2>銘柄ごとの討論</h2>' +
          '<div>' + (day.tickers || []).map(debateEntry).join("") + '</div>' +
          '<p class="note">見送った銘柄(HOLD)も省いていない。' +
            '「なぜ買わなかったか」が読めないと、判断の半分が検証できなくなるため。</p>' +
        '</div>';
    }

    $("view-debate").innerHTML =
      '<div class="block"><h2>日付</h2><div class="pills" id="dayPills">' + pills + '</div></div>' + body;

    const holder = $("dayPills");
    showPressed(holder);
    if (holder){
      holder.addEventListener("click", function(ev){
        const btn = ev.target.closest("[data-day]");
        if (!btn) return;
        state.day = btn.getAttribute("data-day");
        renderDebate();
        loadDay(state.day);
      });
    }
  }

  /* ------------------------------------------------------------ 銘柄 */

  function renderTicker(){
    const s = state.summary;
    const list = s.tickers || [];
    if (!state.ticker && list.length) state.ticker = list[0];

    const chips = list.map(function(t){
      return '<button class="pill" type="button" data-ticker="' + esc(t) + '" aria-pressed="' +
        (t === state.ticker ? "true" : "false") + '">' + esc(t) + '</button>';
    }).join("");

    const data = state.ticker ? state.tickers[state.ticker] : null;
    let body;

    if (!list.length){
      body = '<div class="empty">まだ対象になった銘柄がありません。</div>';
    } else if (!data){
      body = '<div class="empty">' + (state.offline
        ? "この端末では銘柄データを読み込めません。"
        : esc(state.ticker) + " を読み込んでいます…") + '</div>';
    } else {
      const p = data.position;
      const facts = p
        ? '<div class="facts">' +
            '<div class="fact"><dt>株数</dt><dd>' + Number(p.shares).toLocaleString() + '</dd></div>' +
            '<div class="fact"><dt>取得単価</dt><dd>' + usd(p.avg_cost) + '</dd></div>' +
            '<div class="fact"><dt>現在値</dt><dd>' + usd(p.price) + '</dd></div>' +
            '<div class="fact"><dt>評価額</dt><dd>' + usd(p.value, 0) + '</dd></div>' +
            '<div class="fact"><dt>含み損益</dt><dd class="' + tone(p.unrealized) + '">' +
              (p.unrealized > 0 ? "+" : "") + usd(p.unrealized) + '</dd></div>' +
          '</div>'
        : '<div class="empty">この銘柄は現在保有していない。</div>';

      const trades = (data.trades || []).map(function(t){
        return '<tr><td class="mono" title="' + esc(t.date) + '">' + esc(jpDate(t.date)) + '</td>' +
          '<td><span class="chip s-' + esc(t.side) + '">' + esc(t.side) + '</span></td>' +
          '<td class="num">' + Number(t.shares).toLocaleString() + '</td>' +
          '<td class="num">' + usd(t.price) + '</td>' +
          '<td class="num">' + usd(t.value, 0) + '</td></tr>';
      }).join("");

      const judged = (data.judgments || []).map(function(j){
        const color = SOURCE_COLOR[j.source] || "--ink-3";
        const result = j.correct == null
          ? '<span class="badge b-agree">採点待ち</span>'
          : '<span class="badge ' + (j.correct ? "b-hit" : "b-conflict") + '">' +
            (j.correct ? "的中" : "外れ") + ' 残差 ' + signed(j.residual_return, 1) + '</span>';
        return '<div class="tl-item">' +
          '<div class="tl-date">' + esc(j.date) + '</div>' +
          '<div class="tl-card" style="color:' + cssVar(color) + '">' +
            '<div class="who"><i class="dot"></i>' + esc(j.label) +
              '<span class="chip s-' + esc(j.stance) + '" style="margin-left:6px">' + esc(j.stance) + '</span>' +
              '<span class="conf">確信 ' + (j.confidence != null ? pct(j.confidence,0) : "—") + '</span>' +
            '</div>' +
            '<div>' + result + '</div>' +
            (j.thesis ? '<p class="thesis">' + esc(j.thesis) + '</p>' : '') +
            (j.falsification ? '<div class="falsi"><b>反証条件</b>' + esc(j.falsification) + '</div>' : '') +
          '</div>' +
        '</div>';
      }).join("");

      body =
        '<div class="block">' +
          '<div class="brand"><h1 class="tk-title">' + esc(data.ticker) + '</h1>' +
            '<span class="as-of">' + esc(data.sector) + '</span></div>' +
          '<div class="panel pad"><div class="chart sm"><canvas id="cPrice"></canvas></div></div>' +
          '<p class="note">調整後終値(配当・分割の影響を除いた実質の値動き)。直近' +
            ((data.prices && data.prices.days.length) || 0) + '営業日。</p>' +
        '</div>' +
        '<div class="block"><h2>保有状況</h2>' + facts + '</div>' +
        (trades
          ? '<div class="block"><h2>この銘柄の売買</h2><div class="panel"><div class="scroll"><table><thead><tr>' +
            '<th>約定日</th><th>売買</th><th class="num">株数</th><th class="num">単価</th><th class="num">金額</th>' +
            '</tr></thead><tbody>' + trades + '</tbody></table></div></div></div>'
          : '') +
        '<div class="block"><h2>この銘柄への判断</h2>' +
          (judged ? '<div class="tl">' + judged + '</div>' : '<div class="empty">判断の記録がない。</div>') +
        '</div>';
    }

    $("view-ticker").innerHTML =
      '<div class="block"><h2>銘柄</h2><div class="pills tkgrid" id="tkPills">' + chips + '</div></div>' + body;

    const holder = $("tkPills");
    showPressed(holder);
    if (holder){
      holder.addEventListener("click", function(ev){
        const btn = ev.target.closest("[data-ticker]");
        if (!btn) return;
        state.ticker = btn.getAttribute("data-ticker");
        renderTicker();
        loadTicker(state.ticker);
      });
    }

    if (data && data.prices && data.prices.days.length){
      const c = cssVar("--accent");
      drawChart("price", "cPrice", {
        type:"line",
        data:{ labels:data.prices.days.map(jpDate), datasets:[{
          label:data.ticker, data:data.prices.close,
          borderColor:c, backgroundColor:cssVar("--accent-wash"),
          borderWidth:1.8, pointRadius:0, pointHoverRadius:3, tension:.15, fill:true
        }]},
        options: Object.assign(axisOptions(function(v){ return "$" + Number(v).toFixed(0); }), {
          plugins:{ legend:{ display:false },
            tooltip:{ callbacks:{ label:function(x){ return usd(x.parsed.y); } } } }
        })
      });
    }
  }

  /* ---------------------------------------------------------- 通信簿 */

  function renderScore(){
    const s = state.summary;
    const pred = s.predictions || {};
    const cal = s.calibration || [];
    const card = s.scorecard || [];
    const horizon = (s.rules && s.rules.scoring_horizon_days) || 20;

    const cardRows = card.map(function(r){
      return '<tr><td>' + esc(r.label) + (r.reliable ? '' : ' <span class="badge b-split">n不足</span>') + '</td>' +
        '<td class="num">' + r.n + '</td>' +
        '<td class="num">' + pct(r.accuracy, 1) + '</td>' +
        '<td class="num">' + pct(r.avg_stated_confidence, 1) + '</td>' +
        '<td class="num ' + (r.calibration_gap > 0.1 ? "neg" : "") + '">' + signed(r.calibration_gap, 1) + '</td></tr>';
    }).join("");

    const allTrades = runView().trades || [];   // 新しい順
    const tradeRows = (state.allTrades ? allTrades : allTrades.slice(0, 10)).map(function(t){
      return '<tr><td class="mono" title="' + esc(t.date) + '">' + esc(jpDate(t.date)) + '</td>' +
        '<td><span class="tk">' + esc(t.ticker) + '</span></td>' +
        '<td><span class="chip s-' + esc(t.side) + '">' + esc(t.side) + '</span></td>' +
        '<td class="num">' + Number(t.shares).toLocaleString() + '</td>' +
        '<td class="num">' + usd(t.price) + '</td>' +
        '<td class="num">' + usd(t.value, 0) + '</td></tr>';
    }).join("");

    $("view-score").innerHTML =
      '<div class="block">' +
        '<h2>採点の進み具合</h2>' +
        '<div class="facts">' +
          '<div class="fact"><dt>記録した判断</dt><dd>' + (pred.recorded || 0) + '</dd></div>' +
          '<div class="fact"><dt>採点済み</dt><dd>' + (pred.scored || 0) + '</dd></div>' +
          '<div class="fact"><dt>採点待ち</dt><dd>' + (pred.awaiting || 0) + '</dd></div>' +
        '</div>' +
        '<p class="note">判断から' + horizon + '営業日たつと採点される。' +
          '採点は「上がったか」ではなく<b>残差リターン(銘柄 − SPY)</b>で行う。' +
          '単純な騰落だと強気相場で何を買っても当たりになってしまうため。</p>' +
      '</div>' +

      '<div class="block">' +
        '<h2>確信度は当たっているか</h2>' +
        (cal.length
          ? '<div class="panel pad"><div class="chart sm"><canvas id="cCal"></canvas></div></div>'
          : '<div class="empty">採点済みの判断が0件。最初の採点が出ると、ここに' +
            '「70%と言った判断が実際に何割当たったか」のグラフが出る。</div>') +
      '</div>' +

      '<div class="block">' +
        '<h2>アナリスト通信簿</h2>' +
        (cardRows
          ? '<div class="panel"><div class="scroll"><table><thead><tr>' +
            '<th>担当</th><th class="num">件数</th><th class="num">的中率</th>' +
            '<th class="num">申告確信度</th><th class="num">ズレ</th>' +
            '</tr></thead><tbody>' + cardRows + '</tbody></table></div></div>'
          : '<div class="empty">まだ採点できる判断がない。</div>') +
        '<p class="note">' + esc(s.scorecard_note || "") + '</p>' +
      '</div>' +

      '<div class="block">' +
        '<h2>取引履歴</h2>' +
        (tradeRows
          ? '<div class="panel"><div class="scroll"><table><thead><tr>' +
            '<th>約定日</th><th>銘柄</th><th>売買</th><th class="num">株数</th>' +
            '<th class="num">単価</th><th class="num">金額</th>' +
            '</tr></thead><tbody>' + tradeRows + '</tbody></table></div></div>' +
            (allTrades.length > 10
              ? '<button class="more" type="button" id="tradesMore">' +
                (state.allTrades ? '最新の10件だけにする' : 'すべて表示（' + allTrades.length + '件）') + '</button>'
              : '')
          : '<div class="empty">まだ約定がない。</div>') +
        '<p class="note">単価には片道0.05%のスリッページを含む。' +
          '手数料を0にすると成績が構造的に甘くなるため、わざと不利側に寄せている。</p>' +
      '</div>';

    const more = $("tradesMore");
    if (more){
      more.addEventListener("click", function(){
        state.allTrades = !state.allTrades;
        renderScore();
      });
    }

    if (cal.length){
      drawChart("cal", "cCal", {
        type:"bar",
        data:{ labels:cal.map(function(b){ return b.range; }), datasets:[
          { label:"申告した確信度", data:cal.map(function(b){ return b.stated_confidence; }),
            backgroundColor:cssVar("--l-rnd"), borderRadius:3 },
          { label:"実際の的中率", data:cal.map(function(b){ return b.actual_accuracy; }),
            backgroundColor:cssVar("--accent"), borderRadius:3 }
        ]},
        options: Object.assign(axisOptions(function(v){ return (v*100).toFixed(0) + "%"; }), {
          plugins:{ legend:{ labels:{ color:cssVar("--ink-2"), boxWidth:12, boxHeight:12,
                                      font:{ size:13 } } } }
        })
      });
    }
  }

  /* ------------------------------------------------------------ 画面 */

  function render(){
    $("asOf").textContent = state.summary.as_of
      ? state.summary.as_of + " の終値時点" : "";
    if (state.view === "home") renderHome();
    else if (state.view === "debate") renderDebate();
    else if (state.view === "ticker") renderTicker();
    else renderScore();
  }

  function switchView(name){
    state.view = name;
    ["home","debate","ticker","score"].forEach(function(v){
      $("view-" + v).hidden = v !== name;
      $("tab-" + v).setAttribute("aria-selected", v === name ? "true" : "false");
    });
    document.body.setAttribute("data-view", name);
    render();
    window.scrollTo(0, 0);
    if (name === "debate" && state.day) loadDay(state.day);
    if (name === "ticker" && state.ticker) loadTicker(state.ticker);
  }

  document.querySelectorAll(".tab").forEach(function(btn){
    btn.addEventListener("click", function(){ switchView(btn.getAttribute("data-view")); });
  });

  /* ------------------------------------------------- データの読み込み */

  // データの出どころは2通りある。同じページを両方で動かすため、
  // 使える方を自動で選ぶ。
  //   Artifact 版  … claude の db から読む(人が承認してアップロードしたもの)
  //   Webサイト版  … 隣に置いてある JSON をそのまま読む(自動で更新される)
  async function fetchDoc(path){
    if (db){
      try{
        const snap = await db.doc(path).get();
        if (snap && snap.exists) return snap.data();
      }catch(e){ /* 下の静的ファイルで拾い直す */ }
    }
    try{
      const res = await fetch("./data/" + path + ".json", { cache: "no-store" });
      return res.ok ? await res.json() : null;
    }catch(e){
      return null;
    }
  }

  async function loadDay(day){
    if (!day || state.days[day]) return;
    const data = await fetchDoc("days/" + day);
    if (data){ state.days[day] = data; if (state.view === "debate") renderDebate(); }
  }

  async function loadTicker(ticker){
    if (!ticker || state.tickers[ticker]) return;
    const data = await fetchDoc("tickers/" + ticker);
    if (data){ state.tickers[ticker] = data; if (state.view === "ticker") renderTicker(); }
  }

  // 場中の現在値。Webサイト版でしか置かれないので、無ければ黙って諦める。
  async function loadLive(){
    try{
      const res = await fetch("./data/live.json", { cache: "no-store" });
      if (!res.ok) return;
      state.live = await res.json();
      if (state.view === "home") renderHome();
    }catch(e){ /* Artifact版には無い。前日終値のまま表示する */ }
  }

  async function boot(){
    render();                       // まず種データで描く。待たせない。
    db = await window.claude?.use?.("db");

    const latest = await fetchDoc("summary/latest");
    if (latest){
      state.summary = latest;
      state.day = null;
      state.ticker = null;
      render();
    } else {
      // db も静的ファイルも読めなかったときだけ、種データのままだと伝える
      state.offline = true;
      render();
    }
    if (state.view === "debate" && state.day) loadDay(state.day);
    if (state.view === "ticker" && state.ticker) loadTicker(state.ticker);

    // 現在値は5分ごとに取り直す。書き出し自体は1時間ごとなので、
    // これは「ページを開きっぱなしにしていても古くならない」ためのもの。
    loadLive();
    setInterval(loadLive, 5 * 60 * 1000);
  }

  document.body.setAttribute("data-view", state.view);
  boot();
})();
</script>

</body>
</html>
