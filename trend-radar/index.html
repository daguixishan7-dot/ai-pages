<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>流行レーダー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap">
<style>
/* 流行レーダーの見た目（2026-10-25 に作り直し）。絵の芯は「日本を真ん中に置いたレーダー」で、真ん中に近いほど今の日本で熱い。
   build_page.py が下の payload の場所に当日のデータを入れる。試作と比べた記録: konomi/kurabe/2026-10-24-trend-radar/ */
:root{
  --font:system-ui, -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", "Meiryo", sans-serif;
  --display:"Dela Gothic One", "Hiragino Sans", "Yu Gothic UI", sans-serif;
  /* 強さの色。気象庁の雨の色の並び（弱い→強い。配色の設定指針 表2-1） */
  --s1:#a0d2ff; --s2:#218cff; --s3:#0041ff; --s4:#faf500; --s5:#ff9900; --s6:#ff2800; --s7:#b40068;
}
/* 色（2026-10-26 に直した）: 白黒だけだと「見にくい」と言われたので、見本のサン防災にならって
   章ごとにうすい色の面を分け（最初＝うすい水色・時差＝うすいすみれ・アプリ＝うすい緑・体温＝うすいオレンジ）、
   レーダーと一覧は白い板にのせる。章の題の下に雨の色の帯。--bg は白い板の色 */
:root{--bg:#ffffff;--text:#151821;--text-2:#535b69;--grid:#e1e5ec;--grid-2:#b6bfcc;
  --p1:#eaf2fc;--p2:#f1edfb;--p3:#e9f6ee;--p4:#fdf0e5;--brand:#0041ff;color-scheme:light;}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#161b24;--text:#f0f3f8;--text-2:#a7afbd;--grid:#2a313d;--grid-2:#4a5466;
    --p1:#0d1420;--p2:#15121f;--p3:#0e1813;--p4:#1d150e;--brand:#7aa2ff;color-scheme:dark;}
}
:root[data-theme="dark"]{--bg:#161b24;--text:#f0f3f8;--text-2:#a7afbd;--grid:#2a313d;--grid-2:#4a5466;
  --p1:#0d1420;--p2:#15121f;--p3:#0e1813;--p4:#1d150e;--brand:#7aa2ff;color-scheme:dark;}
/* 章ごとのうすい色の面 */
.part:nth-of-type(1),.part:nth-of-type(5){background:var(--p1);}
.part:nth-of-type(2){background:var(--p2);}
.part:nth-of-type(3){background:var(--p3);}
.part:nth-of-type(4){background:var(--p4);}

*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{margin:0;background:var(--p1);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;}
a{color:inherit;}
:focus-visible{outline:2px solid currentColor;outline-offset:3px;border-radius:6px;}
.num{font-variant-numeric:tabular-nums;}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px;}

/* ── 最初の場面 ── */
.hero{padding:10px 0 8px;overflow:hidden;}
.marquee{display:flex;width:max-content;color:var(--brand);font-family:var(--display);font-size:clamp(92px, 28vw, 300px);line-height:1.02;white-space:nowrap;animation:marq 48s linear infinite;}
.marquee span{padding-right:.3em;}
@keyframes marq{to{transform:translateX(-50%);}}
.hero-meta{display:flex;justify-content:space-between;gap:12px;margin-top:6px;font-size:14px;color:var(--text-2);}

.sec{padding-top:40px;padding-bottom:64px;}
.grid{display:grid;gap:22px;}
.sec-title{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(44px, 13vw, 92px);line-height:1.05;}
/* 章の題の下に、雨の色の帯（弱い→強い） */
.sec-title::after,.headline::after{content:"";display:block;width:132px;height:8px;margin-top:12px;border-radius:4px;background:linear-gradient(90deg,var(--s1) 0 14%,var(--s2) 14% 28%,var(--s3) 28% 42%,var(--s4) 42% 57%,var(--s5) 57% 71%,var(--s6) 71% 85%,var(--s7) 85%);}
.headline{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(30px, 8.6vw, 54px);line-height:1.22;}
.lead{margin:14px 0 0;font-size:17px;line-height:1.75;max-width:34em;}
.note{margin:10px 0 0;font-size:14px;line-height:1.7;color:var(--text-2);max-width:40em;}
.legend{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;font-size:13px;color:var(--text-2);}
.legend .bar{display:flex;gap:2px;}
.legend .bar i{width:18px;height:10px;border-radius:2px;}

/* ── レーダー（どの場面も同じ円） ── */
.radar-col{background:var(--bg);border-radius:24px;padding:18px 14px 14px;}
.radar{position:relative;width:100%;max-width:520px;aspect-ratio:1/1;margin:0 auto;}
.radar svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;}
.sweep{position:absolute;inset:5.36%;border-radius:50%;pointer-events:none;opacity:0;
  background:conic-gradient(from 0deg, transparent 0deg 300deg, color-mix(in srgb, var(--text) 10%, transparent) 359deg, color-mix(in srgb, var(--text) 40%, transparent) 360deg);}
.radar.on .sweep{opacity:1;animation:sweep 6s linear infinite;}
@keyframes sweep{to{transform:rotate(360deg);}}
.ring{fill:none;stroke:var(--grid);stroke-width:.5;}
.ring.edge{stroke:var(--grid-2);stroke-width:.8;}
.ring.key{stroke:var(--grid-2);stroke-dasharray:1.6 1.6;}
.axis{stroke:var(--grid);stroke-width:.5;}
.tick{stroke:var(--grid-2);stroke-width:.5;}
.rl{font-size:5.6px;fill:var(--text-2);font-family:var(--font);}
.cl{font-size:7.5px;font-weight:700;fill:var(--text);font-family:var(--font);}
.lb{font-size:6.4px;font-weight:700;fill:var(--text);font-family:var(--font);paint-order:stroke;stroke:var(--bg);stroke-width:2.2px;stroke-linejoin:round;}
.tr{stroke-width:1.1;stroke-linecap:round;opacity:.55;}
.b{stroke:var(--text);stroke-opacity:.35;stroke-width:.5;}
.b.land{fill:var(--text);}
.hit{fill:transparent;cursor:pointer;}
.radar.on .b{opacity:.4;animation:ping 6s linear infinite;animation-delay:var(--d);}
@keyframes ping{0%{opacity:1;}100%{opacity:.4;}}

/* ── 一覧 ── */
.items{list-style:none;margin:22px 0 0;padding:0 14px;background:var(--bg);border-radius:20px;}
.item{display:flex;gap:12px;padding:14px 4px 14px 0;border-bottom:1px solid var(--grid);}
.item:last-child{border-bottom:0;}
.item[hidden]{display:none;}
.item:target, .item.flash{animation:flash 1.8s ease-out;}
@keyframes flash{from{background:color-mix(in srgb, var(--text) 14%, transparent);}to{background:transparent;}}
.dot{flex:none;width:11px;height:11px;margin-top:6px;border-radius:50%;box-shadow:0 0 0 1px color-mix(in srgb, var(--text) 35%, transparent);}
.icon{flex:none;width:44px;height:44px;border-radius:10px;background:var(--grid);object-fit:cover;}
.no{flex:none;min-width:30px;margin-top:1px;font-size:13px;color:var(--text-2);}
.it{flex:1;min-width:0;}
.it-name{font-size:16px;font-weight:700;line-height:1.45;word-break:break-word;}
.it-name a{text-decoration:none;}
.it-name a:hover{text-decoration:underline;}
.it-move{margin-top:3px;font-size:15px;}
.it-move b{font-weight:700;}
.it-desc{margin-top:3px;font-size:14px;line-height:1.6;color:var(--text-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.it-meta{margin-top:3px;font-size:13px;line-height:1.55;color:var(--text-2);}
.spark{display:block;width:100%;max-width:240px;height:30px;margin-top:6px;overflow:visible;}
.more{display:block;width:100%;min-height:48px;margin-top:18px;border:1px solid var(--brand);border-radius:999px;background:var(--bg);color:var(--brand);font:inherit;font-size:15px;font-weight:700;cursor:pointer;}
.check{margin:20px 0 0;padding:4px 14px;list-style:none;background:var(--bg);border-radius:20px;}
.check li{padding:10px 0;border-bottom:1px solid var(--grid);font-size:14px;line-height:1.6;}
.check li:last-child{border-bottom:0;}
.check li b{font-weight:700;}
.quiet{margin-top:20px;font-size:15px;color:var(--text-2);}
.notes{list-style:none;margin:14px 0 0;padding:0 14px;background:var(--bg);border-radius:16px;}
.notes li{padding:10px 0;border-top:1px solid var(--grid);font-size:14px;line-height:1.6;}
.notes li:first-child{border-top:0;}

/* ── 終わり ── */
.end{padding-top:48px;padding-bottom:40px;}
.end-mark{color:var(--brand);font-family:var(--display);font-size:clamp(56px, 15.4vw, 190px);line-height:1;margin:0;white-space:nowrap;}
.end-note{margin:22px 0 0;font-size:13px;line-height:1.75;color:var(--text-2);max-width:46em;}

/* パソコンの幅: レーダーを左に止め、一覧を右に流す */
@media (min-width:1000px){
  .grid{grid-template-columns:minmax(420px, 500px) 1fr;gap:56px;align-items:start;}
  .radar-col{position:sticky;top:28px;}
  .sec{padding-top:72px;padding-bottom:96px;}
}
@media (prefers-reduced-motion: reduce){
  .marquee{animation:none;}
  .radar.on .sweep{animation:none;opacity:0;}
  .radar.on .b{animation:none;opacity:1;}
  .item:target, .item.flash{animation:none;}
}
</style>

  function xy(r, deg){ var a = (deg - 90) * Math.PI / 180; return [r * Math.cos(a), r * Math.sin(a)]; }
  function f1(n){ return (Math.round(n * 10) / 10).toString(); }
  function shortName(s){
    s = String(s).split(/\s[-–—:：|｜]\s|[（(]/)[0].trim();
    return s.length > 11 ? s.slice(0, 10) + "…" : s;
  }
  function hash(s){ var h = 0; for (var i = 0; i < s.length; i++){ h = (h * 31 + s.charCodeAt(i)) | 0; } return Math.abs(h); }

  /* ══ レーダーの絵（全部の場面で同じ円を使う） ══
     p = {r, deg, t(強さ0〜1), from(昨日などの位置), label, row(一覧の行のid), title, land} */
  function radar(points, o){
    var g = "";
    (o.rings || [[25],[50],[75]]).forEach(function(rg){
      g += '<circle class="ring' + (rg[2] ? " key" : "") + '" r="' + f1(rg[0]) + '"/>';
      if (rg[1]) g += '<text class="rl" x="1.5" y="' + f1(-rg[0] - 1.6) + '">' + esc(rg[1]) + '</text>';
    });
    g += '<circle class="ring edge" r="100"/>';
    g += '<line class="axis" x1="-100" y1="0" x2="100" y2="0"/><line class="axis" x1="0" y1="-100" x2="0" y2="100"/>';
    for (var d = 0; d < 360; d += 10){
      var a1 = xy(100, d), a2 = xy(d % 30 ? 97.5 : 95, d);
      g += '<line class="tick" x1="' + f1(a1[0]) + '" y1="' + f1(a1[1]) + '" x2="' + f1(a2[0]) + '" y2="' + f1(a2[1]) + '"/>';
    }
    (o.extra || []).forEach(function(s){ g += s; });
    var trails = "", blips = "", labels = "", placed = [];
    points.forEach(function(p){
      var c = p.land ? null : color(p.t);
      var at = xy(p.r, p.deg);
      if (p.from != null && Math.abs(p.from - p.r) > 1.5){
        var fr = xy(p.from, p.deg);
        trails += '<line class="tr" stroke="' + c + '" x1="' + f1(fr[0]) + '" y1="' + f1(fr[1]) + '" x2="' + f1(at[0]) + '" y2="' + f1(at[1]) + '"/>';
      }
      var size = p.size != null ? p.size : 2 + 2.6 * p.t;
      var delay = (((p.deg % 360) + 360) % 360) / 360 * SWEEP;
      blips += '<g' + (p.row ? ' data-row="' + p.row + '"' : '') + '>'
        + (p.title ? '<title>' + esc(p.title) + '</title>' : '')
        + '<circle class="b' + (p.land ? " land" : "") + '" style="--d:' + delay.toFixed(2) + 's"' + (c ? ' fill="' + c + '"' : '')
        + ' cx="' + f1(at[0]) + '" cy="' + f1(at[1]) + '" r="' + f1(size) + '"/>'
        + (p.row ? '<circle class="hit" cx="' + f1(at[0]) + '" cy="' + f1(at[1]) + '" r="7"/>' : '')
        + '</g>';
      if (p.label){
        var right = at[0] >= -2;
        var lx = at[0] + (right ? size + 2 : -size - 2), ly = at[1] + 2.2, w = p.label.length * 5.6;
        var x0 = right ? lx : lx - w;
        // ほかの名前と重なるときは、少しずつ下にずらす
        for (var tries = 0; tries < 4; tries++){
          var hit = placed.some(function(q){ return Math.abs(q.y - ly) < 7 && x0 < q.x + q.w && q.x < x0 + w; });
          if (!hit) break;
          ly += 7.5;
        }
        placed.push({x:x0, y:ly, w:w});
        labels += '<text class="lb" x="' + f1(lx) + '" y="' + f1(ly) + '"'
          + (right ? '' : ' text-anchor="end"') + '>' + esc(p.label) + '</text>';
      }
    });
    (o.texts || []).forEach(function(s){ labels += s; });
    return '<div class="radar" role="img" aria-label="' + esc(o.aria) + '">'
      + '<svg viewBox="-112 -112 224 224" aria-hidden="true">' + g + trails + blips + labels + '</svg>'
      + '<div class="sweep"></div></div>';
  }
  function legend(){
    return '<div class="legend"><span>弱い</span><span class="bar">'
      + S.map(function(c){ return '<i style="background:' + c + '"></i>'; }).join("")
      + '</span><span>強い</span></div>';
  }
  function dot(t, land){ return '<span class="dot" style="background:' + (land ? "currentColor" : color(t)) + '"></span>'; }
  function ranksOf(a){
    return Object.keys(a.ranks).sort(function(x, y){ return a.ranks[x] - a.ranks[y]; })
      .map(function(c){ return (CL[c] || c) + a.ranks[c] + "位"; }).join("・");
  }
  /* 「もっと見る」で開く一覧 */
  function moreButton(id, total, first){
    return total > first ? '<button class="more" type="button" data-more="' + id + '" data-step="25">もっと見る（残り ' + (total - first) + ' 件）</button>' : "";
  }

  /* ══ 1. 今日の合図（最初の場面） ══ */
  function rankR(k){ return 100 * Math.sqrt(k / 100); }      // 1位→10、100位→100
  var fired = D.apps.filter(function(a){ return (a.labels || []).some(function(l){ return l.charAt(0) === "★"; }); });
  var sig = fired.map(function(a){
    var w = (a.why || [])[0] || "", m = w.match(/日本\s*(\d+)位\s*→\s*(\d+)位/);
    var now = a.ranks.jp || 100, prev = m ? +m[1] : null;
    return {a:a, now:now, prev:prev, jump:(prev || 101) - now,
            kind:(a.labels || []).filter(function(l){ return l.charAt(0) === "★"; }).map(function(l){ return l.slice(1); }).join("・")};
  });
  var maxJump = Math.max.apply(null, sig.map(function(s){ return s.jump; }).concat([1]));
  var sigSorted = sig.slice().sort(function(x, y){ return y.jump - x.jump; });
  var sigPts = sig.slice().sort(function(x, y){ return x.now - y.now; }).map(function(s, i){
    s.t = s.jump / maxJump;
    s.row = "sig-" + sigSorted.indexOf(s);
    return {r:rankR(s.now), from:s.prev ? rankR(s.prev) : 111, deg:(i * GOLD) % 360, t:s.t,
            row:s.row, title:s.a.name + "（" + (s.prev ? "日本" + s.prev + "位" : "圏外") + " → " + s.now + "位）",
            label:sigSorted.indexOf(s) < 3 ? shortName(s.a.name) : ""};
  });
  var rankRings = [[rankR(10), "10位"], [rankR(30), "30位"], [rankR(60), "60位"]];

  var wd = ["日","月","火","水","木","金","土"], gd = new Date(D.generated + "T00:00:00");
  var dateText = (gd.getMonth() + 1) + "月" + gd.getDate() + "日（" + wd[gd.getDay()] + "）";

  var h = "";
  h += '<section class="part"><div class="hero" aria-hidden="true"><div class="marquee"><span>流行レーダー</span><span>流行レーダー</span></div></div>'
    + '<div class="wrap"><div class="hero-meta num"><span>' + esc(dateText) + '</span><span>観測 ' + D.days_of_data + ' 日目</span></div>'
    + ((D.notes || []).length ? '<ul class="notes">' + D.notes.map(function(n){ return '<li>' + esc(n) + '</li>'; }).join("") + '</ul>' : '')
    + '</div>'
    + '<div class="wrap sec" style="padding-top:22px"><div class="grid"><div class="radar-col">'
    + radar(sigPts, {rings:rankRings, aria:"今日の合図のレーダー。真ん中に近いほど日本の上位。"})
    + legend() + '</div><div>'
    + '<h1 class="headline">' + (sig.length ? '今日、' + sig.length + '件が<br>日本の上位に近づいた。' : '今日は静かな日。') + '</h1>'
    + '<p class="lead">真ん中に近いほど、今の日本で熱い。線は昨日からの動き。外から入ってきた点は、昨日は100位の外にいたもの。</p>'
    + '<p class="note">色は動きの大きさ。並びは気象庁の雨の色（弱い雨の水色から、猛烈な雨の赤紫まで）。</p>';
  if (sig.length){
    h += '<ol class="items">';
    sigSorted.forEach(function(s, i){
      var a = s.a, url = safeUrl(a.url);
      h += '<li class="item" id="sig-' + i + '">' + dot(s.t)
        + (a.icon ? '<img class="icon" src="' + esc(safeUrl(a.icon)) + '" alt="" loading="lazy">' : '')
        + '<div class="it"><div class="it-name">' + (url ? '<a href="' + esc(url) + '" target="_blank" rel="noopener">' + esc(a.name) + '</a>' : esc(a.name)) + '</div>'
        + '<div class="it-move num">日本 <b>' + (s.prev ? s.prev + '位' : '圏外') + '</b> → <b>' + s.now + '位</b></div>'
        + '<div class="it-meta">' + esc(s.kind) + '・' + esc(a.genre || "ジャンル不明") + '・評価 ' + (a.ratings || 0).toLocaleString() + '件</div></div></li>';
    });
    h += '</ol>';
  } else {
    h += '<p class="quiet">今日は前日から動いたものがありませんでした。</p>';
  }
  h += '</div></div></div></section>';

  /* ══ 2. 時差（黒の場面） ══ */
  var items = LAG.items || [];
  var bySrc = {HN:[], GitHub:[]};
  items.forEach(function(x, i){ x._i = i; (bySrc[x.source] || (bySrc[x.source] = [])).push(x); });
  var lagPts = [];
  Object.keys(bySrc).forEach(function(src){
    var list = bySrc[src].slice().sort(function(a, b){ return b.score - a.score; });
    var maxHeat = Math.max.apply(null, list.map(function(x){ return x.heat; }).concat([2]));
    var base = src === "HN" ? 180 : 0;
    list.forEach(function(x, j){
      var t = Math.log(Math.max(x.heat, 1)) / Math.log(maxHeat);
      x._t = t;
      lagPts.push({r:62 + 38 * (x.quiet_pt / 100) - (j % 3) * 2.6, deg:base + (j + 0.5) / list.length * 180, t:t,
                   row:"lag-" + x._i, title:"#" + (x._i + 1) + " " + x.title + "（" + x.source + "）",
                   label:x._i < 2 ? "#" + (x._i + 1) + " " + shortName(x.title.split("/").pop()) : ""});
    });
  });
  (LAG.landed || []).forEach(function(x, k){
    lagPts.push({r:5 + (k % 4) * 3.4, deg:(k * GOLD) % 360, t:0, land:true, size:1.9, title:"上陸: " + x.title + "（" + x.lag_days + "日後）"});
  });
  var lagTexts = ['<line class="axis" x1="0" y1="-106" x2="0" y2="106" stroke-dasharray="2 2"/>',
                  '<text class="cl" x="-6" y="-104" text-anchor="end">HN</text>', '<text class="cl" x="6" y="-104">GitHub</text>'];
  if ((LAG.landed || []).length) lagTexts.push('<text class="cl" x="0" y="27" text-anchor="middle">上陸 ' + LAG.landed.length + '</text>');
  var C = LAG.check;
  h += '<section class="part"><div class="wrap sec"><div class="grid"><div class="radar-col">'
    + radar(lagPts, {rings:[[20, "上陸", true], [62, ""]], texts:lagTexts, aria:"時差のレーダー。外側ほど日本ではまだ静か。真ん中は日本に上陸したもの。"})
    + legend() + '</div><div>'
    + '<h2 class="sec-title">時差</h2>'
    + '<p class="lead">英語で熱く、日本語ではまだ静か。外側ほど日本では誰も話していない。真ん中まで来たら上陸。</p>'
    + '<p class="note">左が Hacker News、右が GitHub。色は英語での熱さ（ポイントやスター）。記事にしたいときは、番号を添えて <b>/jisa-draft 3</b> のように頼むと日本語の下書きを作ります。</p>';
  if (C){
    h += '<ul class="check">'
      + '<li>' + (C.judged
          ? '静かなうちに見つけて1週間以上たった <b class="num">' + C.judged + '</b> 件のうち、<b class="num">' + C.landed + '</b> 件が日本に上陸した'
            + (C.median_days != null ? '（中央値 <b class="num">' + C.median_days + '</b> 日後）' : '') + '。'
          : '答え合わせはまだです。') + '「上陸」は、はてブと Qiita 記事×5 の合計が ' + C.land_line + ' 以上になったこと（仮の基準）。</li>';
    (LAG.landed || []).slice(0, 5).forEach(function(x){
      h += '<li>上陸: ' + esc(x.title) + '<br><span class="num" style="color:var(--text-2)">' + esc(x.first_seen) + ' に発見 → ' + esc(x.landed) + '（' + x.lag_days + '日後）</span></li>';
    });
    h += '</ul>';
  }
  if (items.length){
    h += '<ol class="items" id="lag-list">';
    items.forEach(function(x, i){
      var url = safeUrl(x.url);
      h += '<li class="item" id="lag-' + i + '"' + (i >= 12 ? " hidden" : "") + '>' + dot(x._t)
        + '<span class="no num">#' + (i + 1) + '</span>'
        + '<div class="it"><div class="it-name">' + (url ? '<a href="' + esc(url) + '" target="_blank" rel="noopener">' + esc(x.title) + '</a>' : esc(x.title)) + '</div>'
        + (x.desc ? '<div class="it-desc">' + esc(x.desc) + '</div>' : '')
        + '<div class="it-meta num">' + esc((x.why || []).join("。"))
        + (safeUrl(x.hn_url) && x.hn_url !== x.url ? '。<a href="' + esc(x.hn_url) + '" target="_blank" rel="noopener">HNの議論</a>' : '') + '</div>'
        + '<div class="it-meta">' + esc((x.labels || []).join("・")) + '</div></div></li>';
    });
    h += '</ol>' + moreButton("lag-list", items.length, 12);
  } else {
    h += '<p class="quiet">時差のデータがまだありません。</p>';
  }
  h += '</div></div></div></section>';

  /* ══ 3. アプリ（白の場面） ══ */
  var apps = D.apps;
  var minS = Math.min.apply(null, apps.map(function(a){ return a.score; }));
  var maxS = Math.max.apply(null, apps.map(function(a){ return a.score; }));
  var jpN = 0;
  var appPts = apps.map(function(a, i){
    var t = (a.score - minS) / Math.max(maxS - minS, 1);
    a._t = t;
    var p = {t:t, row:"app-" + i, title:a.name + "（" + ranksOf(a) + "）", label:i < 3 ? shortName(a.name) : "", size:1.4 + 2.4 * t};
    if (a.ranks.jp){
      p.r = 46 * Math.sqrt(a.ranks.jp / 100);
      p.deg = (jpN++ * GOLD) % 360;
    } else {
      var best = Object.keys(a.ranks).sort(function(x, y){ return a.ranks[x] - a.ranks[y]; })[0];
      p.r = 54 + 46 * Math.sqrt(a.ranks[best] / 100);
      p.deg = (BEARING[best] || 0) + (hash(a.id || a.name) % 37) - 18;
    }
    return p;
  });
  var appTexts = [];
  Object.keys(BEARING).forEach(function(c){
    var p = xy(107, BEARING[c]);
    appTexts.push('<text class="cl" x="' + f1(p[0]) + '" y="' + f1(p[1] + 2.5) + '" text-anchor="middle">' + CL[c] + '</text>');
  });
  appTexts.push('<text class="cl" x="0" y="-49.5" text-anchor="middle">日本の上位</text>');
  var notJp = apps.filter(function(a){ return !a.ranks.jp; }).length;
  h += '<section class="part"><div class="wrap sec"><div class="grid"><div class="radar-col">'
    + radar(appPts, {rings:[[48, "", true], [77, ""]], texts:appTexts, aria:"アプリのレーダー。真ん中の円が日本の上位。日本にないアプリはその国の方角。"})
    + legend() + '</div><div>'
    + '<h2 class="sec-title">アプリ</h2>'
    + '<p class="lead">真ん中の円が日本の上位 100。日本にまだないアプリ（' + notJp + '件）は、その国の方角に置いた。韓国は西、台湾は南西、米国は北東。</p>'
    + '<p class="note">1件も捨てずに、気になる順に並べている。色は気になる度合い（点数）。厳しく絞ると setlog のような本命を取りこぼすことが、実際の検証で分かったため。</p>'
    + '<ol class="items" id="app-list">';
  apps.forEach(function(a, i){
    var url = safeUrl(a.url);
    h += '<li class="item" id="app-' + i + '"' + (i >= 15 ? " hidden" : "") + '>' + dot(a._t)
      + (a.icon ? '<img class="icon" src="' + esc(safeUrl(a.icon)) + '" alt="" loading="lazy">' : '')
      + '<div class="it"><div class="it-name">' + (url ? '<a href="' + esc(url) + '" target="_blank" rel="noopener">' + esc(a.name) + '</a>' : esc(a.name)) + '</div>'
      + '<div class="it-move num">' + esc(ranksOf(a)) + '</div>'
      + '<div class="it-meta num">' + esc(a.genre || "ジャンル不明") + '・評価 ' + (a.ratings || 0).toLocaleString() + '件・' + esc((a.labels || []).map(function(l){ return l.replace(/^★/, ""); }).join("・")) + '</div>'
      + ((a.why || []).length ? '<div class="it-meta">' + esc(a.why.slice(0, 2).join("。")) + '</div>' : '')
      + '</div></li>';
  });
  h += '</ol>' + moreButton("app-list", apps.length, 15) + '</div></div></div></section>';

  /* ══ 4. 流行の体温（黒の場面） ══ */
  var HOT = ["再燃", "急上昇", "上昇中", "ピーク中"];
  function dropR(d){ return 8 + 92 * d / 100; }
  var wiki = D.wiki.slice().sort(function(a, b){ return a.drop_pct - b.drop_pct; });
  var wikiPts = wiki.map(function(w, i){
    var r = dropR(w.drop_pct), shift = Math.max(-26, Math.min(26, w.mom30_pct * 0.32));
    var t = (100 - w.drop_pct) / 100 * 0.86 + (HOT.indexOf(w.phase) >= 0 ? 0.14 : 0);
    w._t = t;
    return {r:r, from:Math.max(4, Math.min(111, r + shift)), deg:(i * GOLD + 20) % 360, t:t,
            row:"w-" + i, title:w.name + "（" + w.phase + "）",
            label:(HOT.indexOf(w.phase) >= 0 || w.mom30_pct > 20 || i < 3) ? w.name : ""};
  });
  h += '<section class="part"><div class="wrap sec"><div class="grid"><div class="radar-col">'
    + radar(wikiPts, {rings:[[dropR(0), ""], [dropR(50), "ピークの半分"], [dropR(90), "ピークの1割"]], aria:"流行の体温のレーダー。真ん中ほど今がピークに近い。"})
    + legend() + '</div><div>'
    + '<h2 class="sec-title">流行の体温</h2>'
    + '<p class="lead">Wikipedia の閲覧数。真ん中ほど、今がピークに近い。線は30日の動きで、内向きの線はまた熱くなっているもの。</p>'
    + '<p class="note">「再燃」は一度終わったものが戻ってきた状態で、一番おいしい。</p><ol class="items">';
  wiki.forEach(function(w, i){
    var v = w.spark || [], mx = Math.max.apply(null, v.concat([1]));
    var pts = v.map(function(y, k){ return (k / Math.max(v.length - 1, 1) * 240).toFixed(1) + "," + (28 - y / mx * 26).toFixed(1); }).join(" ");
    var up = w.mom30_pct >= 0;
    h += '<li class="item" id="w-' + i + '">' + dot(w._t)
      + '<div class="it"><div class="it-name">' + esc(w.name) + '<span style="font-weight:400;color:var(--text-2)">　' + esc(w.phase) + (w.uncertain ? '・要確認' : '') + '</span></div>'
      + '<svg class="spark" viewBox="0 0 240 30" preserveAspectRatio="none" aria-hidden="true"><polyline points="' + pts + '" fill="none" stroke="' + color(w._t) + '" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>'
      + '<div class="it-meta num">1日 ' + Math.round(w.now_7d).toLocaleString() + '回・ピークの ' + (100 - w.drop_pct).toFixed(0) + '%・30日で ' + (up ? '+' : '') + w.mom30_pct.toFixed(0) + '%</div>'
      + '</div></li>';
  });
  h += '</ol></div></div></div></section>';

  /* ══ 終わり（白の場面） ══ */
  h += '<section class="part"><div class="wrap end"><p class="end-mark">流行レーダー</p>'
    + '<p class="end-note">毎朝6時に GitHub Actions が作り直しています。データ: Apple App Store ランキング RSS、iTunes Lookup API、Wikimedia 閲覧数 API、Hacker News API、GitHub 検索 API、はてなブックマーク件数 API、Qiita API（すべて無料）。色の並びは気象庁「気象庁ホームページにおける気象情報の配色に関する設定指針」の降水量の色。</p>'
    + '</div></section>';

  document.getElementById("page").innerHTML = h;

  /* 画面に入ったレーダーだけ動かす */
  var radars = document.querySelectorAll(".radar");
  if ("IntersectionObserver" in window){
    var io = new IntersectionObserver(function(es){
      es.forEach(function(e){ e.target.classList.toggle("on", e.isIntersecting); });
    }, {threshold:0.35});
    radars.forEach(function(r){ io.observe(r); });
  } else {
    radars.forEach(function(r){ r.classList.add("on"); });
  }

  /* もっと見る */
  document.addEventListener("click", function(ev){
    var b = ev.target.closest("[data-more]");
    if (b){
      var list = document.getElementById(b.getAttribute("data-more"));
      var hid = list.querySelectorAll(".item[hidden]");
      for (var i = 0; i < Math.min(25, hid.length); i++) hid[i].hidden = false;
      var rest = list.querySelectorAll(".item[hidden]").length;
      if (rest) b.textContent = "もっと見る（残り " + rest + " 件）"; else b.remove();
      return;
    }
    /* レーダーの点を押すと、一覧のその行へ */
    var g = ev.target.closest("[data-row]");
    if (g){
      var row = document.getElementById(g.getAttribute("data-row"));
      if (!row) return;
      if (row.hidden){
        var lst = row.parentNode, all = lst.querySelectorAll(".item"), idx = Array.prototype.indexOf.call(all, row);
        for (var k = 0; k <= idx; k++) all[k].hidden = false;
        var btn = document.querySelector('[data-more="' + lst.id + '"]'), left = lst.querySelectorAll(".item[hidden]").length;
        if (btn){ if (left) btn.textContent = "もっと見る（残り " + left + " 件）"; else btn.remove(); }
      }
      row.scrollIntoView({block:"center", behavior:matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
      row.classList.remove("flash"); void row.offsetWidth; row.classList.add("flash");
    }
  });
})();
</script>
